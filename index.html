<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未來科技感數字時鐘</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入科技感等寬與無襯線字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- 引入 Tone.js 製作科技脈衝音效 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        cyber: ['"Orbitron"', 'sans-serif'],
                        mono: ['"Share Tech Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center p-4 bg-slate-950 text-cyan-400 select-none overflow-x-hidden transition-colors duration-500" id="app-body">

    <!-- 背景科技網格與掃描光暈 -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <!-- 網格底紋 -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:3rem_3rem] [mask-image:radial-gradient(ellipse_80%_80%_at_50%_50%,#000_60%,transparent_100%)] opacity-40"></div>
        <!-- 動態霓虹光暈 -->
        <div id="ambient-glow" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[32rem] h-[32rem] rounded-full bg-cyan-500/15 blur-[100px] transition-colors duration-700"></div>
    </div>

    <!-- 主控台 HUD 容器 -->
    <main id="hud-card" class="relative z-10 w-full max-w-xl bg-slate-900/80 backdrop-blur-xl rounded-3xl border border-cyan-500/40 shadow-[0_0_40px_rgba(6,182,212,0.15)] p-6 sm:p-8 flex flex-col justify-between transition-all duration-500">
        
        <!-- 四個角落的科技感裝飾邊框 -->
        <div id="corner-tl" class="absolute top-3 left-3 w-4 h-4 border-t-2 border-l-2 border-cyan-400 rounded-tl-md transition-colors duration-500"></div>
        <div id="corner-tr" class="absolute top-3 right-3 w-4 h-4 border-t-2 border-r-2 border-cyan-400 rounded-tr-md transition-colors duration-500"></div>
        <div id="corner-bl" class="absolute bottom-3 left-3 w-4 h-4 border-b-2 border-l-2 border-cyan-400 rounded-bl-md transition-colors duration-500"></div>
        <div id="corner-br" class="absolute bottom-3 right-3 w-4 h-4 border-b-2 border-r-2 border-cyan-400 rounded-br-md transition-colors duration-500"></div>

        <!-- 頂部系統狀態列 -->
        <header class="w-full flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div class="flex items-center gap-2.5">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                <span class="font-mono text-xs sm:text-sm tracking-widest uppercase opacity-90" id="sys-status">SYS.CHRONO // ONLINE</span>
            </div>

            <div class="flex items-center gap-3">
                <!-- 時區顯示 -->
                <span class="font-mono text-xs px-2.5 py-1 rounded-md bg-slate-800/90 border border-slate-700 text-slate-300" id="timezone-badge">
                    UTC+8
                </span>

                <!-- 音效開關按鈕 -->
                <button id="sound-toggle" class="p-2 rounded-xl bg-slate-800/90 border border-cyan-500/30 hover:border-cyan-400 transition-all duration-300 active:scale-90" title="開啟/關閉電子脈衝音效">
                    <svg id="icon-sound-off" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                    </svg>
                    <svg id="icon-sound-on" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 核心數字時鐘顯示區 (可點擊觸發資料掃描特效) -->
        <section id="clock-core" class="relative w-full py-6 px-4 rounded-2xl bg-slate-950/70 border border-slate-800/90 flex flex-col items-center justify-center cursor-pointer group overflow-hidden mb-6" title="點擊執行時間同步掃描">
            
            <!-- 掃描光條動畫 -->
            <div id="scan-beam" class="absolute inset-0 bg-gradient-to-r from-transparent via-cyan-400/20 to-transparent -translate-x-full pointer-events-none"></div>

            <!-- AM / PM 指示標籤 -->
            <div class="w-full flex justify-between items-center px-2 mb-1">
                <span class="font-mono text-xs tracking-widest text-slate-500">QUANTUM_SYNC_CLOCK</span>
                <span id="ampm-badge" class="font-cyber text-xs font-bold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 hidden">AM</span>
            </div>

            <!-- 超大霓虹數字時間 -->
            <div class="flex items-baseline justify-center my-2">
                <span id="time-hm" class="font-cyber text-5xl sm:text-7xl font-black tracking-wider drop-shadow-[0_0_15px_rgba(34,211,238,0.6)] transition-all duration-300">
                    12:00
                </span>
                <div class="flex flex-col items-start ml-2 sm:ml-3">
                    <span id="time-sec" class="font-mono text-2xl sm:text-3xl font-bold opacity-90">00</span>
                    <span id="time-ms" class="font-mono text-xs text-slate-400">.00</span>
                </div>
            </div>

            <!-- 60秒動態能量進度條 -->
            <div class="w-full max-w-md mt-4">
                <div class="flex justify-between font-mono text-[10px] text-slate-400 mb-1">
                    <span>SEC_PROGRESS</span>
                    <span id="sec-percent">0%</span>
                </div>
                <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden p-[1px]">
                    <div id="sec-progress-bar" class="h-full w-0 bg-cyan-400 rounded-full shadow-[0_0_8px_rgba(34,211,238,0.8)] transition-all duration-75"></div>
                </div>
            </div>
        </section>

        <!-- 數據資訊列：日期、星期、今年第幾天 -->
        <section class="grid grid-cols-3 gap-2.5 sm:gap-4 mb-6">
            <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center">
                <span class="font-mono text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider">DATE</span>
                <span id="date-val" class="font-mono text-sm sm:text-base font-bold mt-1 text-slate-100">2026.11.25</span>
            </div>
            <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center">
                <span class="font-mono text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider">DAY</span>
                <span id="day-val" class="font-cyber text-sm sm:text-base font-bold mt-1">WED / 週三</span>
            </div>
            <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center">
                <span class="font-mono text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider">DAY_OF_YR</span>
                <span id="doy-val" class="font-mono text-sm sm:text-base font-bold mt-1 text-slate-100">329 / 365</span>
            </div>
        </section>

        <!-- 底部控制面板：光譜主題切換 & 12/24小時制 -->
        <footer class="w-full flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800/80">
            <!-- 霓虹光譜選擇器 -->
            <div class="flex items-center gap-1.5 bg-slate-950/80 p-1.5 rounded-2xl border border-slate-800">
                <button data-theme="cyan" class="theme-btn px-3 py-1.5 rounded-xl font-mono text-xs font-bold flex items-center gap-1.5 transition-all duration-300 bg-cyan-500/20 text-cyan-300 border border-cyan-500/50">
                    <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                    <span>CYBER</span>
                </button>
                <button data-theme="emerald" class="theme-btn px-3 py-1.5 rounded-xl font-mono text-xs font-bold flex items-center gap-1.5 transition-all duration-300 text-slate-400 hover:text-emerald-300 border border-transparent">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span>MATRIX</span>
                </button>
                <button data-theme="fuchsia" class="theme-btn px-3 py-1.5 rounded-xl font-mono text-xs font-bold flex items-center gap-1.5 transition-all duration-300 text-slate-400 hover:text-fuchsia-300 border border-transparent">
                    <span class="w-2 h-2 rounded-full bg-fuchsia-400"></span>
                    <span>SYNTH</span>
                </button>
            </div>

            <!-- 12 / 24 小時制切換按鈕 -->
            <button id="format-toggle" class="px-4 py-2 rounded-2xl font-mono text-xs font-bold tracking-wider uppercase bg-slate-800/90 hover:bg-slate-700 border border-cyan-500/30 transition-all duration-300 active:scale-95">
                MODE: 24H
            </button>
        </footer>
    </main>

    <!-- 系統提示氣泡 (替代 alert) -->
    <div id="toast-msg" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-xl bg-slate-900/95 border border-cyan-500/50 text-cyan-300 font-mono text-xs tracking-wider shadow-[0_0_20px_rgba(6,182,212,0.3)] opacity-0 pointer-events-none transition-all duration-300 transform translate-y-4 z-50">
        [SYS] AUDIO PULSE ENABLED
    </div>

    <script>
        // ==========================================
        // 1. 狀態與科技光譜主題設定
        // ==========================================
        let is24Hour = true;
        let isSoundOn = false;
        let currentTheme = 'cyan';
        let lastSecond = -1;
        let pulseSynth = null;
        let uiSynth = null;

        const themes = {
            cyan: {
                name: 'CYBER CYAN',
                textMain: 'text-cyan-400',
                glowBg: 'bg-cyan-500/15',
                cardBorder: 'border-cyan-500/40 shadow-[0_0_40px_rgba(6,182,212,0.15)]',
                cornerBorder: 'border-cyan-400',
                dotBg: 'bg-cyan-400',
                timeDropShadow: 'drop-shadow-[0_0_15px_rgba(34,211,238,0.6)]',
                progressBar: 'bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.8)]',
                btnBorder: 'border-cyan-500/30 hover:border-cyan-400',
                badgeStyle: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/30',
                activeBtn: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/50',
                scanVia: 'via-cyan-400/20',
                toastBorder: 'border-cyan-500/50 text-cyan-300 shadow-[0_0_20px_rgba(6,182,212,0.3)]'
            },
            emerald: {
                name: 'MATRIX GREEN',
                textMain: 'text-emerald-400',
                glowBg: 'bg-emerald-500/15',
                cardBorder: 'border-emerald-500/40 shadow-[0_0_40px_rgba(16,185,129,0.15)]',
                cornerBorder: 'border-emerald-400',
                dotBg: 'bg-emerald-400',
                timeDropShadow: 'drop-shadow-[0_0_15px_rgba(52,211,153,0.6)]',
                progressBar: 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]',
                btnBorder: 'border-emerald-500/30 hover:border-emerald-400',
                badgeStyle: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
                activeBtn: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50',
                scanVia: 'via-emerald-400/20',
                toastBorder: 'border-emerald-500/50 text-emerald-300 shadow-[0_0_20px_rgba(16,185,129,0.3)]'
            },
            fuchsia: {
                name: 'SYNTH VIOLET',
                textMain: 'text-fuchsia-400',
                glowBg: 'bg-fuchsia-500/15',
                cardBorder: 'border-fuchsia-500/40 shadow-[0_0_40px_rgba(217,70,239,0.15)]',
                cornerBorder: 'border-fuchsia-400',
                dotBg: 'bg-fuchsia-400',
                timeDropShadow: 'drop-shadow-[0_0_15px_rgba(232,121,249,0.6)]',
                progressBar: 'bg-fuchsia-400 shadow-[0_0_8px_rgba(232,121,249,0.8)]',
                btnBorder: 'border-fuchsia-500/30 hover:border-fuchsia-400',
                badgeStyle: 'bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-500/30',
                activeBtn: 'bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-500/50',
                scanVia: 'via-fuchsia-400/20',
                toastBorder: 'border-fuchsia-500/50 text-fuchsia-300 shadow-[0_0_20px_rgba(217,70,239,0.3)]'
            }
        };

        // ==========================================
        // 2. 科技音效合成器 (Tone.js)
        // ==========================================
        function initAudio() {
            if (!pulseSynth && typeof Tone !== 'undefined') {
                // 高頻短促電子脈衝音
                pulseSynth = new Tone.Synth({
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.001, decay: 0.03, sustain: 0, release: 0.01 }
                }).toDestination();
                pulseSynth.volume.value = -20;

                // UI 切換提示音
                uiSynth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.005, decay: 0.08, sustain: 0, release: 0.05 }
                }).toDestination();
                uiSynth.volume.value = -12;
            }
        }

        function playPulse(isTopOfMinute) {
            if (!isSoundOn) return;
            try {
                initAudio();
                if (pulseSynth) {
                    pulseSynth.triggerAttackRelease(isTopOfMinute ? 'A6' : 'E6', '64n');
                }
            } catch (e) {
                console.warn('音效播放略過:', e);
            }
        }

        function playUiBeep(freq = 'C6') {
            if (!isSoundOn) return;
            try {
                initAudio();
                if (uiSynth) {
                    uiSynth.triggerAttackRelease(freq, '32n');
                }
            } catch (e) {
                console.warn('UI音效播放略過:', e);
            }
        }

        // ==========================================
        // 3. 高精度時間更新迴圈
        // ==========================================
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // 每秒觸發脈衝音效
            if (seconds !== lastSecond) {
                lastSecond = seconds;
                playPulse(seconds === 0);
            }

            // 處理 12/24 小時制
            let displayHours = hours;
            const ampmBadge = document.getElementById('ampm-badge');
            if (!is24Hour) {
                ampmBadge.classList.remove('hidden');
                ampmBadge.textContent = hours >= 12 ? 'PM' : 'AM';
                displayHours = hours % 12;
                if (displayHours === 0) displayHours = 12;
            } else {
                ampmBadge.classList.add('hidden');
            }

            // 格式化數字
            const strH = String(displayHours).padStart(2, '0');
            const strM = String(minutes).padStart(2, '0');
            const strS = String(seconds).padStart(2, '0');
            const strMs = String(Math.floor(milliseconds / 10)).padStart(2, '0');

            document.getElementById('time-hm').textContent = `${strH}:${strM}`;
            document.getElementById('time-sec').textContent = strS;
            document.getElementById('time-ms').textContent = `.${strMs}`;

            // 更新 60 秒進度條
            const totalSec = seconds + milliseconds / 1000;
            const percent = (totalSec / 60) * 100;
            document.getElementById('sec-progress-bar').style.width = `${percent.toFixed(2)}%`;
            document.getElementById('sec-percent').textContent = `${Math.floor(percent)}%`;

            // 更新日期與數據面板
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            document.getElementById('date-val').textContent = `${year}.${month}.${date}`;

            const enDays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const zhDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            document.getElementById('day-val').textContent = `${enDays[now.getDay()]} / ${zhDays[now.getDay()]}`;

            // 計算今年第幾天
            const startOfYear = new Date(year, 0, 0);
            const diff = now - startOfYear;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            document.getElementById('doy-val').textContent = `${String(dayOfYear).padStart(3, '0')} / ${isLeap ? 366 : 365}`;

            requestAnimationFrame(updateClock);
        }

        // ==========================================
        // 4. 切換光譜主題
        // ==========================================
        function applyTheme(themeKey) {
            currentTheme = themeKey;
            const t = themes[themeKey];

            document.getElementById('app-body').className = `min-h-screen w-full flex flex-col items-center justify-center p-4 bg-slate-950 select-none overflow-x-hidden transition-colors duration-500 ${t.textMain}`;
            document.getElementById('ambient-glow').className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[32rem] h-[32rem] rounded-full blur-[100px] transition-colors duration-700 ${t.glowBg}`;
            document.getElementById('hud-card').className = `relative z-10 w-full max-w-xl bg-slate-900/80 backdrop-blur-xl rounded-3xl border p-6 sm:p-8 flex flex-col justify-between transition-all duration-500 ${t.cardBorder}`;

            // 角落邊框
            ['corner-tl', 'corner-tr', 'corner-bl', 'corner-br'].forEach(id => {
                const el = document.getElementById(id);
                el.className = el.className.replace(/border-(cyan|emerald|fuchsia)-400/g, t.cornerBorder);
            });

            document.getElementById('status-dot').className = `w-2.5 h-2.5 rounded-full animate-ping ${t.dotBg}`;
            document.getElementById('time-hm').className = `font-cyber text-5xl sm:text-7xl font-black tracking-wider transition-all duration-300 ${t.timeDropShadow}`;
            document.getElementById('sec-progress-bar').className = `h-full w-0 rounded-full transition-all duration-75 ${t.progressBar}`;
            document.getElementById('ampm-badge').className = `font-cyber text-xs font-bold px-2 py-0.5 rounded border ${t.badgeStyle} ${is24Hour ? 'hidden' : ''}`;
            document.getElementById('sound-toggle').className = `p-2 rounded-xl bg-slate-800/90 border transition-all duration-300 active:scale-90 ${t.btnBorder}`;
            document.getElementById('format-toggle').className = `px-4 py-2 rounded-2xl font-mono text-xs font-bold tracking-wider uppercase bg-slate-800/90 hover:bg-slate-700 border transition-all duration-300 active:scale-95 ${t.btnBorder}`;
            document.getElementById('scan-beam').className = `absolute inset-0 bg-gradient-to-r from-transparent ${t.scanVia} to-transparent -translate-x-full pointer-events-none`;

            // 更新主題按鈕高亮
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.theme === themeKey) {
                    btn.className = `theme-btn px-3 py-1.5 rounded-xl font-mono text-xs font-bold flex items-center gap-1.5 transition-all duration-300 border ${t.activeBtn}`;
                } else {
                    btn.className = 'theme-btn px-3 py-1.5 rounded-xl font-mono text-xs font-bold flex items-center gap-1.5 transition-all duration-300 text-slate-400 hover:text-slate-200 border border-transparent';
                }
            });
        }

        // ==========================================
        // 5. 系統提示訊息 (替代 alert)
        // ==========================================
        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            const t = themes[currentTheme];
            toast.textContent = msg;
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-xl bg-slate-900/95 border font-mono text-xs tracking-wider transition-all duration-300 transform z-50 opacity-100 translate-y-0 ${t.toastBorder}`;

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }

        // ==========================================
        // 6. 事件綁定與初始化
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            // 自動偵測本地時區偏移
            const offset = -new Date().getTimezoneOffset() / 60;
            document.getElementById('timezone-badge').textContent = `UTC${offset >= 0 ? '+' + offset : offset}`;

            applyTheme('cyan');
            requestAnimationFrame(updateClock);

            // 主題切換
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const selected = btn.dataset.theme;
                    if (selected !== currentTheme) {
                        applyTheme(selected);
                        playUiBeep('G6');
                        showToast(`[SYS] THEME // ${themes[selected].name}`);
                    }
                });
            });

            // 12 / 24 小時制切換
            const formatBtn = document.getElementById('format-toggle');
            formatBtn.addEventListener('click', () => {
                is24Hour = !is24Hour;
                formatBtn.textContent = is24Hour ? 'MODE: 24H' : 'MODE: 12H';
                playUiBeep('E6');
                showToast(`[SYS] FORMAT // ${is24Hour ? '24-HOUR' : '12-HOUR'}`);
            });

            // 音效開關
            const soundBtn = document.getElementById('sound-toggle');
            soundBtn.addEventListener('click', async () => {
                isSoundOn = !isSoundOn;
                const iconOff = document.getElementById('icon-sound-off');
                const iconOn = document.getElementById('icon-sound-on');

                if (isSoundOn) {
                    if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
                        await Tone.start();
                    }
                    iconOff.classList.add('hidden');
                    iconOn.classList.remove('hidden');
                    playUiBeep('A6');
                    showToast('[SYS] AUDIO PULSE // ONLINE');
                } else {
                    iconOn.classList.add('hidden');
                    iconOff.classList.remove('hidden');
                    showToast('[SYS] AUDIO PULSE // MUTED');
                }
            });

            // 點擊核心數字面板觸發掃描光束特效
            const clockCore = document.getElementById('clock-core');
            const scanBeam = document.getElementById('scan-beam');
            clockCore.addEventListener('click', () => {
                playUiBeep('C7');
                scanBeam.classList.remove('transition-transform', 'duration-700', 'translate-x-full');
                scanBeam.classList.add('-translate-x-full');
                
                // 強制重繪以觸發動畫
                void scanBeam.offsetWidth;
                
                scanBeam.classList.add('transition-transform', 'duration-700', 'translate-x-full');
                scanBeam.classList.remove('-translate-x-full');
                showToast('[SYNC] ATOMIC CLOCK CALIBRATED');
            });
        });
    </script>
</body>
</html>
