<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可愛小時鐘</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #fff4f7, #eaf8ff);
    overflow: hidden;
  }

  .clock-wrap {
    position: relative;
    width: min(88vw, 430px);
    padding: 34px 28px 28px;
    border-radius: 38px;
    background: rgba(255,255,255,.86);
    box-shadow: 0 20px 50px rgba(120, 140, 160, .18);
    text-align: center;
  }

  /* 小耳朵 */
  .ear {
    position: absolute;
    width: 76px;
    height: 76px;
    top: -18px;
    border-radius: 50%;
    background: #ffd6df;
    border: 7px solid #fff;
    z-index: -1;
  }
  .ear.left { left: 42px; }
  .ear.right { right: 42px; }

  .face {
    width: min(72vw, 300px);
    aspect-ratio: 1;
    margin: 0 auto 22px;
    border-radius: 50%;
    position: relative;
    background: #fffdf7;
    border: 10px solid #ffb8c8;
    box-shadow:
      inset 0 0 0 5px #fff,
      0 12px 30px rgba(255, 150, 170, .18);
  }

  .tick {
    position: absolute;
    inset: 8%;
    text-align: center;
  }
  .tick span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 12px;
    border-radius: 5px;
    background: #b9a9b0;
    transform-origin: 50% calc((min(72vw, 300px) * .42));
  }

  .number {
    position: absolute;
    font-size: 21px;
    font-weight: 800;
    color: #7f7078;
  }
  .n12 { top: 14px; left: 50%; transform: translateX(-50%); }
  .n3  { right: 16px; top: 50%; transform: translateY(-50%); }
  .n6  { bottom: 14px; left: 50%; transform: translateX(-50%); }
  .n9  { left: 16px; top: 50%; transform: translateY(-50%); }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 10px;
    transform: translateX(-50%) rotate(0deg);
  }
  .hour {
    width: 9px;
    height: 27%;
    background: #7b6b74;
  }
  .minute {
    width: 7px;
    height: 36%;
    background: #ff8da5;
  }
  .second {
    width: 3px;
    height: 39%;
    background: #76c9d6;
  }

  .center {
    position: absolute;
    width: 19px;
    height: 19px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #ff8da5;
    border: 4px solid white;
    box-shadow: 0 2px 5px rgba(0,0,0,.12);
  }

  .digital {
    font-size: clamp(34px, 10vw, 52px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #62545c;
    line-height: 1;
  }

  .date {
    margin-top: 12px;
    color: #9b8992;
    font-size: 15px;
    font-weight: 600;
  }

  .mood {
    margin-top: 18px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 17px;
    border-radius: 999px;
    background: #fff0f4;
    color: #a56b7b;
    font-size: 14px;
    font-weight: 700;
  }

  .face-dot {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #6d5c64;
    border-radius: 50%;
    top: 61%;
  }
  .eye-l { left: 38%; }
  .eye-r { right: 38%; }

  .smile {
    position: absolute;
    width: 34px;
    height: 18px;
    left: 50%;
    top: 66%;
    transform: translateX(-50%);
    border-bottom: 4px solid #8b6872;
    border-radius: 0 0 30px 30px;
  }

  .sparkle {
    position: fixed;
    color: rgba(255, 170, 190, .65);
    font-size: 24px;
    animation: float 4s ease-in-out infinite;
  }
  .s1 { left: 8%; top: 18%; }
  .s2 { right: 9%; top: 25%; animation-delay: 1s; }
  .s3 { left: 13%; bottom: 17%; animation-delay: 2s; }
  .s4 { right: 13%; bottom: 12%; animation-delay: 3s; }

  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(12deg); }
  }
</style>
</head>
<body>

<div class="sparkle s1">✦</div>
<div class="sparkle s2">♡</div>
<div class="sparkle s3">✧</div>
<div class="sparkle s4">♡</div>

<div class="clock-wrap">
  <div class="ear left"></div>
  <div class="ear right"></div>

  <div class="face">
    <div class="number n12">12</div>
    <div class="number n3">3</div>
    <div class="number n6">6</div>
    <div class="number n9">9</div>

    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="center"></div>

    <div class="face-dot eye-l"></div>
    <div class="face-dot eye-r"></div>
    <div class="smile"></div>
  </div>

  <div class="digital" id="digital">00:00:00</div>
  <div class="date" id="date"></div>
  <div class="mood">☀️ 今天也要慢慢來，準時就好！</div>
</div>

<script>
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  const ms = now.getMilliseconds();

  const hourDeg = ((h % 12) + m / 60) * 30;
  const minuteDeg = (m + s / 60) * 6;
  const secondDeg = (s + ms / 1000) * 6;

  document.getElementById("hour").style.transform =
    `translateX(-50%) rotate(${hourDeg}deg)`;
  document.getElementById("minute").style.transform =
    `translateX(-50%) rotate(${minuteDeg}deg)`;
  document.getElementById("second").style.transform =
    `translateX(-50%) rotate(${secondDeg}deg)`;

  const pad = n => String(n).padStart(2, "0");
  document.getElementById("digital").textContent =
    `${pad(h)}:${pad(m)}:${pad(s)}`;

  const weekdays = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  document.getElementById("date").textContent =
    `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日　${weekdays[now.getDay()]}`;
}

updateClock();
setInterval(updateClock, 50);
</script>

</body>
</html>
